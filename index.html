<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>15 năm Phucbinh Group</title>
  <link rel="icon" href="https://phucbinh.com.vn/wp-content/uploads/2023/03/cropped-Group-8-180x180.png" type="image/png" sizes="500x500">

  <!-- ========== SOCIAL PREVIEW (Open Graph + Twitter Card) ========== -->
  <link rel="canonical" href="https://www.15namphucbinhgroup.online/">
  <meta property="og:locale" content="vi_VN">
  <meta property="og:title" content="15 năm Phucbinh Group">
  <meta property="og:description" content="Cùng nhau kiến tạo tương lai">
  <!-- SỬA: og:url phải là URL trang, không phải URL ảnh -->
  <meta property="og:url" content="https://www.15namphucbinhgroup.online/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Phucbinh Group">
  <!-- Ảnh preview (tạm đang dùng pinimg). Khuyến nghị đặt ảnh trên chính domain của bạn -->
  <meta property="og:image" content="https://i.pinimg.com/736x/7b/ba/16/7bba16221be6308721a09eefffc13ab3.jpg">
  <meta property="og:image:secure_url" content="https://i.pinimg.com/736x/7b/ba/16/7bba16221be6308721a09eefffc13ab3.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- Thứ tự QUAN TRỌNG: common trước, rồi desktop, rồi mobile -->
  <link rel="stylesheet" href="./css/common.css">
  <link rel="stylesheet" href="./css/desktop.css">
  <link rel="stylesheet" href="./css/mobile.css">

  <!-- Ẩn mọi control WebKit cho mobile video đề phòng hệ thống tự hiện -->
  <style>
    .mob-video::-webkit-media-controls,
    .mob-video::-webkit-media-controls-enclosure { display: none !important; }
  </style>
</head>

<body>

  <!-- Overlay với logo quay (không crop, responsive) -->
  <div id="overlayReload">
    <div class="logo-loader">
      <img src="https://phucbinh.com.vn/wp-content/uploads/2023/03/cropped-Group-8-180x180.png" alt="Phucbinh Group">
    </div>
  </div>

  <!-- ===== DESKTOP ===== -->
  <div class="desktop-layout">
    <div class="slider-container">
      <div class="slider-wrapper" id="sliderDesktop">
        <!-- Trang 1 -->
        <div class="slide">
          <video class="desk-video" preload="metadata" muted playsinline>
            <source src="./data/trang 1 pc.mp4" type="video/mp4"/>
          </video>
        </div>
        <!-- Trang 2 -->
        <div class="slide">
          <video class="desk-video" preload="metadata" muted playsinline>
            <source src="./data/trang 2 pc.mp4" type="video/mp4"/>
          </video>
        </div>
      </div>

      <!-- Nút điều hướng -->
      <button class="prev-button" onclick="goToPageDesktop(1, true)">&#10094;</button>
      <button class="next-button" onclick="goToPageDesktop(2, true)">&#10095;</button>
    </div>
  </div>

  <!-- ===== MOBILE ===== -->
  <div class="mobile-layout">
    <div class="slider-container">
      <div class="slider-wrapper" id="sliderMobile">
        <!-- Trang 1 -->
        <div class="slide">
          <!-- SỬA: preload=none + poster đen + chặn UI -->
          <video class="mob-video"
                 preload="none"
                 poster="./data/black.jpg"
                 muted playsinline webkit-playsinline
                 disablepictureinpicture
                 controlslist="nodownload noplaybackrate nofullscreen">
            <source src="./data/trang 1 .mp4" type="video/mp4"/>
          </video>
        </div>
        <!-- Trang 2 -->
        <div class="slide">
          <video class="mob-video"
                 preload="none"
                 poster="./data/black.jpg"
                 muted playsinline webkit-playsinline
                 disablepictureinpicture
                 controlslist="nodownload noplaybackrate nofullscreen">
            <source src="./data/trang 2 .mp4" type="video/mp4"/>
          </video>
        </div>
      </div>

      <!-- Nút điều hướng -->
      <button class="button prev-button" onclick="goToPageMobile(1, true)">&#10094;</button>
      <button class="button next-button" onclick="goToPageMobile(2, true)">&#10095;</button>
    </div>
  </div>

  <script>
  const sliderDesktop = document.getElementById("sliderDesktop");
  const sliderMobile  = document.getElementById("sliderMobile");
  const overlay       = document.getElementById("overlayReload");

  const deskVideos = Array.from(document.querySelectorAll(".desk-video"));
  const mobVideos  = Array.from(document.querySelectorAll(".mob-video"));

  // Dừng & reset 1 mảng video
  function resetAll(videos) {
    videos.forEach(v => { try { v.pause(); v.currentTime = 0; } catch(e){} });
  }

  // Phát an toàn (đã tương thích iOS)
  function safePlay(videoEl) {
    videoEl.load(); // đảm bảo buffer trước
    const tryPlay = () => videoEl.play().catch(() => {});
    if (videoEl.readyState >= 2) {
      tryPlay();
    } else {
      const onReady = () => { videoEl.removeEventListener('canplay', onReady); tryPlay(); };
      videoEl.addEventListener('canplay', onReady, { once: true });
    }
  }

  /**
   * HÀM DÙNG CHUNG CHO CẢ PC & MOBILE
   * @param {'desktop'|'mobile'} device
   * @param {number} page 1 hoặc 2
   * @param {boolean} restart true = tua về 0 rồi phát
   */
  function goToPage(device, page, restart = false) {
    const offset = (page - 1) * 50;
    const isDesktop = device === 'desktop';

    const slider = isDesktop ? sliderDesktop : sliderMobile;
    const videos = isDesktop ? deskVideos : mobVideos;

    if (slider) slider.style.transform = `translateX(-${offset}%)`;

    // Dừng & reset tất cả video còn lại
    resetAll(videos);

    // Video mục tiêu
    const idx = page - 1;
    const target = videos[idx];
    if (target) {
      // Giống PC: nhấn nút là CHẠY + (nếu restart) tua về 0
      if (!isDesktop) {
        // mobile: vẫn có poster đen khi mới mở, nhưng bấm là chạy như PC
        target.preload = 'auto'; // bật tải khi người dùng bấm
      }
      if (restart) target.currentTime = 0;
      safePlay(target);
    }
  }

  // Alias cho code HTML cũ (để không phải sửa onclick trong HTML)
  function goToPageDesktop(page, restart = false) { goToPage('desktop', page, restart); }
  function goToPageMobile(page, restart = false)  { goToPage('mobile',  page, restart); }

  /* ==== Reload mềm (nếu cần) ==== */
  function softReload() {
    overlay.classList.add('show');
    resetAll(deskVideos); resetAll(mobVideos);

    [...deskVideos, ...mobVideos].forEach(v => {
      const srcEl = v.querySelector('source');
      if (!srcEl) return;
      try {
        const url = new URL(srcEl.getAttribute('src'), location.href);
        url.searchParams.set('_r', Date.now().toString());
        srcEl.setAttribute('src', url.toString());
        v.load();
      } catch (e) { v.load(); }
    });

    let done = false;
    const off = () => { if (!done){ done = true; overlay.classList.remove('show'); } };
    setTimeout(off, 3000);
    const anyVideo = deskVideos[0] || mobVideos[0];
    if (anyVideo) anyVideo.addEventListener('loadeddata', off, { once:true });
  }

  // Mặc định hiển thị trang 1 cho cả PC & Mobile (KHÔNG tự chạy)
  goToPageDesktop(1, false);
  goToPageMobile(1, false);
</script>


</body>
</html>
