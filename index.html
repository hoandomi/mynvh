<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>15 năm Phucbinh Group</title>
  <link rel="icon" href="https://phucbinh.com.vn/wp-content/uploads/2023/03/cropped-Group-8-180x180.png" type="image/png" sizes="500x500">

  <!-- ========== SOCIAL PREVIEW (Open Graph + Twitter Card) ========== -->
  <link rel="canonical" href="https://www.15namphucbinhgroup.online/">
  <meta property="og:locale" content="vi_VN">
  <meta property="og:title" content="15 năm Phucbinh Group">
  <meta property="og:description" content="Cùng nhau kiến tạo tương lai">
  <meta property="og:url" content="https://www.15namphucbinhgroup.online/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Phucbinh Group">
  <meta property="og:image" content="https://i.pinimg.com/736x/7b/ba/16/7bba16221be6308721a09eefffc13ab3.jpg">
  <meta property="og:image:secure_url" content="https://i.pinimg.com/736x/7b/ba/16/7bba16221be6308721a09eefffc13ab3.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- Thứ tự QUAN TRỌNG: common trước, rồi desktop, rồi mobile -->
  <link rel="stylesheet" href="./css/common.css">
  <link rel="stylesheet" href="./css/desktop.css">
  <link rel="stylesheet" href="./css/mobile.css">

  <!-- Ẩn mọi control WebKit cho mobile video đề phòng hệ thống tự hiện -->
  <style>
    .mob-video::-webkit-media-controls,
    .mob-video::-webkit-media-controls-enclosure { display: none !important; }
  </style>
</head>

<body>

  <!-- Overlay với logo quay (không crop, responsive) -->
  <div id="overlayReload">
    <div class="logo-loader">
      <img src="https://phucbinh.com.vn/wp-content/uploads/2023/03/cropped-Group-8-180x180.png" alt="Phucbinh Group">
    </div>
  </div>

  <!-- ===== DESKTOP ===== -->
  <div class="desktop-layout">
    <div class="slider-container">
      <div class="slider-wrapper" id="sliderDesktop">
        <!-- Trang 1 -->
        <div class="slide">
          <video class="desk-video" preload="metadata" muted playsinline>
            <source src="./data/trang 1 pc.mp4" type="video/mp4"/>
          </video>
        </div>
        <!-- Trang 2 -->
        <div class="slide">
          <video class="desk-video" preload="metadata" muted playsinline>
            <source src="./data/trang 2 pc.mp4" type="video/mp4"/>
          </video>
        </div>
      </div>

      <!-- Nút điều hướng -->
      <button class="prev-button" onclick="goToPageDesktop(1, true)">&#10094;</button>
      <button class="next-button" onclick="goToPageDesktop(2, true)">&#10095;</button>
    </div>
  </div>

  <!-- ===== MOBILE ===== -->
  <div class="mobile-layout">
    <div class="slider-container">
      <div class="slider-wrapper" id="sliderMobile">
        <!-- Trang 1 -->
        <div class="slide">
          <!-- Mobile: mở web đen, không tự chạy; chỉ chạy khi bấm -->
          <video class="mob-video"
                 preload="auto"
                 autoplay
                 muted playsinline webkit-playsinline
                 x5-playsinline x5-video-player-type="h5"
                 disablepictureinpicture
                 controlslist="nodownload noplaybackrate nofullscreen noremoteplayback">
            <source src="./data/trang 1 .mp4" type="video/mp4"/>
          </video>
        </div>
        <!-- Trang 2 -->
        <div class="slide">
          <video class="mob-video"
                 preload="none"
                 poster=""
                 muted playsinline webkit-playsinline
                 x5-playsinline x5-video-player-type="h5"
                 disablepictureinpicture
                 controlslist="nodownload noplaybackrate nofullscreen noremoteplayback">
            <source src="./data/trang 2 .mp4" type="video/mp4"/>
          </video>
        </div>
      </div>

      <!-- Nút điều hướng -->
      <button class="button prev-button" onclick="goToPageMobile(1, true)">&#10094;</button>
      <button class="button next-button" onclick="goToPageMobile(2, true)">&#10095;</button>
    </div>
  </div>
  <script>
  // ===== DOM =====
  const sliderDesktop = document.getElementById("sliderDesktop");
  const sliderMobile  = document.getElementById("sliderMobile");
  const overlay       = document.getElementById("overlayReload");

  const deskVideos = Array.from(document.querySelectorAll(".desk-video"));
  const mobVideos  = Array.from(document.querySelectorAll(".mob-video"));

  // ===== Helpers =====
  function resetAll(videos) {
    videos.forEach(v => { try { v.pause(); v.currentTime = 0; } catch(e){} });
  }

  // Ép thuộc tính cần thiết để autoplay ổn định (PC & Mobile)
  function ensureAutoplayAttrs(videoEl) {
    videoEl.muted = true;
    videoEl.setAttribute('muted', '');
    videoEl.autoplay = true;
    videoEl.setAttribute('autoplay', '');
    videoEl.preload = 'auto';
    videoEl.setAttribute('preload', 'auto');
    videoEl.setAttribute('playsinline', '');
    videoEl.setAttribute('webkit-playsinline', '');
    if (videoEl.hasAttribute('poster')) videoEl.removeAttribute('poster');
  }

  // Phát an toàn (không cần gesture)
  function safePlay(videoEl) {
    try {
      videoEl.load();
      const go = () => videoEl.play().catch(()=>{});
      if (videoEl.readyState >= 2) go();
      else videoEl.addEventListener('canplay', go, { once:true });
    } catch(_) {}
  }

  // ===== Desktop =====
  function goToPageDesktop(page, restart=false) {
    const offset = (page - 1) * 50;
    if (sliderDesktop) sliderDesktop.style.transform = `translateX(-${offset}%)`;

    resetAll(deskVideos);

    const idx = page - 1;
    const target = deskVideos[idx];
    if (!target) return;

    ensureAutoplayAttrs(target);
    if (restart) target.currentTime = 0;
    safePlay(target);
  }

  // ===== Mobile =====
  function goToPageMobile(page, restart=false) {
    const offset = (page - 1) * 50;
    if (sliderMobile) sliderMobile.style.transform = `translateX(-${offset}%)`;

    resetAll(mobVideos);

    const idx = page - 1;
    const target = mobVideos[idx];
    if (!target) return;

    ensureAutoplayAttrs(target);
    if (restart) target.currentTime = 0;
    safePlay(target);
  }

  // Bridge touchend -> click (hợp webview/Zalo)
  document.querySelectorAll('.mobile-layout .button, .mobile-layout .next-button, .mobile-layout .prev-button')
    .forEach(btn => {
      btn.addEventListener('touchend', e => { e.currentTarget.click(); }, { passive:true });
    });

  // Pause khi ẩn tab, resume khi quay lại
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      [...deskVideos, ...mobVideos].forEach(v => { try{ v.pause(); }catch(_){ } });
    } else {
      const isMobile = matchMedia('(max-width: 1024px)').matches;
      if (isMobile) {
        const v = mobVideos[currentMobileIndex];
        if (v) { ensureAutoplayAttrs(v); safePlay(v); }
      } else {
        const v = deskVideos[currentDesktopIndex];
        if (v) { ensureAutoplayAttrs(v); safePlay(v); }
      }
    }
  });

  // Theo dõi index hiện tại
  let currentMobileIndex = 0;
  let currentDesktopIndex = 0;
  const _goToPageMobile = goToPageMobile;
  const _goToPageDesktop = goToPageDesktop;

  goToPageMobile = function(page, restart=false){
    currentMobileIndex = Math.max(0, Math.min(page - 1, mobVideos.length - 1));
    _goToPageMobile(page, restart);
  }
  goToPageDesktop = function(page, restart=false){
    currentDesktopIndex = Math.max(0, Math.min(page - 1, deskVideos.length - 1));
    _goToPageDesktop(page, restart);
  }

  // ===== Khởi tạo =====
  (function init(){
    resetAll(deskVideos);
    deskVideos.forEach(ensureAutoplayAttrs);
    mobVideos.forEach(ensureAutoplayAttrs);

    // Mở trang 1 và AUTO PLAY cả Desktop lẫn Mobile
    goToPageDesktop(1, true);
    goToPageMobile(1, true);
  })();

  // (Tuỳ chọn) Reload mềm nếu cần
  function softReload() {
    if (!overlay) return;
    overlay.classList.add('show');
    resetAll(deskVideos); resetAll(mobVideos);

    [...deskVideos, ...mobVideos].forEach(v => {
      const srcEl = v.querySelector('source');
      if (!srcEl) return;
      try {
        const url = new URL(srcEl.getAttribute('src'), location.href);
        url.searchParams.set('_r', Date.now().toString());
        srcEl.setAttribute('src', url.toString());
        v.load();
      } catch (e) { v.load(); }
    });

    let done = false;
    const off = () => { if (!done){ done = true; overlay.classList.remove('show'); } };
    setTimeout(off, 3000);
    const anyVideo = deskVideos[0] || mobVideos[0];
    if (anyVideo) anyVideo.addEventListener('loadeddata', off, { once:true });
  }
</script>
</body>
</html>
