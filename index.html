<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>15 năm Phucbinh Group</title>
  <link rel="icon" href="https://phucbinh.com.vn/wp-content/uploads/2023/03/cropped-Group-8-180x180.png" type="image/png" sizes="500x500">

  <!-- ========== SOCIAL PREVIEW (Open Graph + Twitter Card) ========== -->
  <link rel="canonical" href="https://www.15namphucbinhgroup.online/">
  <meta property="og:locale" content="vi_VN">
  <meta property="og:title" content="15 năm Phucbinh Group">
  <meta property="og:description" content="Cùng nhau kiến tạo tương lai">
  <meta property="og:url" content="https://www.15namphucbinhgroup.online/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Phucbinh Group">
  <meta property="og:image" content="https://i.pinimg.com/736x/7b/ba/16/7bba16221be6308721a09eefffc13ab3.jpg">
  <meta property="og:image:secure_url" content="https://i.pinimg.com/736x/7b/ba/16/7bba16221be6308721a09eefffc13ab3.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- Thứ tự QUAN TRỌNG: common trước, rồi desktop, rồi mobile -->
  <link rel="stylesheet" href="./css/common.css">
  <link rel="stylesheet" href="./css/desktop.css">
  <link rel="stylesheet" href="./css/mobile.css">

  <!-- Ẩn mọi control WebKit cho mobile video đề phòng hệ thống tự hiện -->
  <style>
  .mob-video::-webkit-media-controls,
  .mob-video::-webkit-media-controls-enclosure { display: none !important; }

  /* Điều khiển overlay */
  #overlayReload { display:none; }
  #overlayReload.show { display:flex; }

  /* CTA cho Zalo mobile — CĂN GIỮA MÀN HÌNH */
  #zaloCta {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%); /* căn giữa ngang + dọc */
    z-index: 9999;
    display: none; /* chỉ bật khi phát hiện Zalo */
    padding: 16px 22px;
    font-size: 18px;
    font-weight: 700;
    line-height: 1;
    border: 0;
    border-radius: 999px;
    background: #0068ff;
    color: #fff;
    box-shadow: 0 10px 28px rgba(0,0,0,.25);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    text-align: center;
    white-space: nowrap;
  }
  #zaloCta:active { transform: translate(-50%, -50%) scale(.98); }
  </style>
</head>

<body>

  <!-- Overlay với logo quay (không crop, responsive) -->
  <div id="overlayReload">
    <div class="logo-loader">
      <img src="https://phucbinh.com.vn/wp-content/uploads/2023/03/cropped-Group-8-180x180.png" alt="Phucbinh Group">
    </div>
  </div>

  <!-- ===== DESKTOP ===== -->
  <div class="desktop-layout">
    <div class="slider-container">
      <div class="slider-wrapper" id="sliderDesktop">
        <!-- Trang 1 -->
        <div class="slide">
          <video class="desk-video" preload="metadata" muted playsinline>
            <source src="./data/1pc.mp4" type="video/mp4"/>
          </video>
        </div>
        <!-- Trang 2 -->
        <div class="slide">
          <video class="desk-video" preload="metadata" muted playsinline>
            <source src="./data/2pc.mp4" type="video/mp4"/>
          </video>
        </div>
      </div>

      <!-- Nút điều hướng -->
      <button class="prev-button" onclick="goToPageDesktop(1, true)">&#10094;</button>
      <button class="next-button" onclick="goToPageDesktop(2, true)">&#10095;</button>
    </div>
  </div>

  <!-- ===== MOBILE ===== -->
  <div class="mobile-layout">
    <div class="slider-container">
      <div class="slider-wrapper" id="sliderMobile">
        <!-- Trang 1 -->
        <div class="slide">
          <video class="mob-video"
                 preload="auto"
                 autoplay
                 muted playsinline webkit-playsinline
                 x5-playsinline x5-video-player-type="h5"
                 disablepictureinpicture
                 controlslist="nodownload noplaybackrate nofullscreen noremoteplayback">
            <source src="./data/1mobile.mp4" type="video/mp4"/>
          </video>
        </div>
        <!-- Trang 2 -->
        <div class="slide">
          <video class="mob-video"
                 preload="none"
                 poster=""
                 muted playsinline webkit-playsinline
                 x5-playsinline x5-video-player-type="h5"
                 disablepictureinpicture
                 controlslist="nodownload noplaybackrate nofullscreen noremoteplayback">
            <source src="./data/2mobile.mp4" type="video/mp4"/>
          </video>
        </div>
      </div>

      <!-- Nút điều hướng -->
      <button class="button prev-button" onclick="goToPageMobile(1, true)">&#10094;</button>
      <button class="button next-button" onclick="goToPageMobile(2, true)">&#10095;</button>
    </div>
  </div>

  <!-- CTA chỉ cho Zalo mobile -->
  <button id="zaloCta" type="button" aria-label="Xem thiệp mời">🎉 Xem thiệp mời</button>

  <script>
    const sliderDesktop = document.getElementById("sliderDesktop");
    const sliderMobile  = document.getElementById("sliderMobile");
    const overlay       = document.getElementById("overlayReload");

    const deskVideos = Array.from(document.querySelectorAll(".desk-video"));
    const mobVideos  = Array.from(document.querySelectorAll(".mob-video"));

    function resetAll(videos) {
      videos.forEach(v => { try { v.pause(); v.currentTime = 0; } catch(e){} });
    }
    resetAll(deskVideos);
    resetAll(mobVideos);

    /* ==== Desktop: giữ như cũ ==== */
    function goToPageDesktop(page, restart=false) {
      const offset = (page - 1) * 50;
      if (sliderDesktop) sliderDesktop.style.transform = `translateX(-${offset}%)`;
      resetAll(deskVideos);
      const idx = page - 1;
      const target = deskVideos[idx];
      if (target) {
        if (restart) target.currentTime = 0;
        safePlay(target);
      }
    }

    /* ==== Mobile: phát ngay trong gesture click/touch (hợp Zalo) ==== */
    function goToPageMobile(page, restart=false) {
      const offset = (page - 1) * 50;
      if (sliderMobile) sliderMobile.style.transform = `translateX(-${offset}%)`;

      resetAll(mobVideos);

      const idx = page - 1;
      const target = mobVideos[idx];
      if (!target) return;

      target.preload = 'auto';
      if (restart) target.currentTime = 0;

      safePlay(target); // auto play như desktop
    }

    function playWithGesture(videoEl) {
      try {
        videoEl.muted = true;
        videoEl.setAttribute('playsinline','');
        videoEl.setAttribute('webkit-playsinline','');
        const p = videoEl.play();
        if (p && typeof p.then === 'function') {
          p.then(()=>{}).catch(() => {
            videoEl.load();
            const onReady = () => { videoEl.removeEventListener('canplay', onReady); videoEl.play().catch(()=>{}); };
            videoEl.addEventListener('canplay', onReady, { once:true });
          });
        }
      } catch (e) {
        try {
          videoEl.load();
          videoEl.addEventListener('canplay', () => videoEl.play().catch(()=>{}), { once:true });
        } catch (_) {}
      }
    }

    function safePlay(videoEl) {
      videoEl.load();
      const go = () => videoEl.play().catch(() => {});
      if (videoEl.readyState >= 2) go();
      else videoEl.addEventListener('canplay', go, { once:true });
    }

    document.querySelectorAll('.mobile-layout .button').forEach(btn=>{
      btn.addEventListener('touchend', e => { e.currentTarget.click(); }, { passive:true });
    });

    function softReload() {
      overlay.classList.add('show');
      resetAll(deskVideos); resetAll(mobVideos);
      [...deskVideos, ...mobVideos].forEach(v => {
        const srcEl = v.querySelector('source');
        if (!srcEl) return;
        try {
          const url = new URL(srcEl.getAttribute('src'), location.href);
          url.searchParams.set('_r', Date.now().toString());
          srcEl.setAttribute('src', url.toString());
          v.load();
        } catch (e) { v.load(); }
      });
      let done = false;
      const off = () => { if (!done){ done = true; overlay.classList.remove('show'); } };
      setTimeout(off, 3000);
      const anyVideo = deskVideos[0] || mobVideos[0];
      if (anyVideo) anyVideo.addEventListener('loadeddata', off, { once:true });
    }

    // ==== Thêm xử lý cho nút CTA trên Zalo ====
    const isMobile = /mobile|android|iphone|ipad|ipod/i.test(navigator.userAgent);
    const isZalo   = /zalo/i.test(navigator.userAgent);
    const zaloCta  = document.getElementById('zaloCta');

    if (isMobile && isZalo && zaloCta) {
      zaloCta.style.display = 'inline-flex';
    }

    // —— BẤM CTA (Zalo: phát ./data/zalo.mp4; Trình duyệt khác: giữ luồng cũ)
    function playInviteNow(){
      if (isMobile && isZalo) {
        // ===== CHẾ ĐỘ ZALO: phát video riêng ./data/zalo.mp4 =====
        resetAll(mobVideos); // dừng toàn bộ video đang có

        // Tạo slide + video mới
        const zaloWrapper = document.createElement("div");
        zaloWrapper.className = "slide zalo-slide";
        zaloWrapper.style.width = "100%";
        zaloWrapper.style.height = "100%";

        const zaloVideo = document.createElement("video");
        zaloVideo.className = "mob-video zalo-video";
        zaloVideo.setAttribute("preload","auto");
        zaloVideo.setAttribute("playsinline","");
        zaloVideo.setAttribute("webkit-playsinline","");
        zaloVideo.setAttribute("x5-playsinline","");
        zaloVideo.setAttribute("x5-video-player-type","h5");
        zaloVideo.setAttribute("disablepictureinpicture","");
        zaloVideo.setAttribute("controlslist","nodownload noplaybackrate nofullscreen noremoteplayback");
        zaloVideo.muted = true;

        const source = document.createElement("source");
        source.src = "./data/zalo.mp4";
        source.type = "video/mp4";
        zaloVideo.appendChild(source);
        zaloWrapper.appendChild(zaloVideo);

        // Thay slider bằng video Zalo duy nhất
        if (sliderMobile){
          sliderMobile.innerHTML = "";
          sliderMobile.appendChild(zaloWrapper);
          sliderMobile.style.transform = "translateX(0%)"; // chắc chắn ở trang đầu
        }

        // Phát video bằng gesture
        playWithGesture(zaloVideo);

        // Ẩn CTA khi bắt đầu chạy
        zaloVideo.addEventListener("playing", () => {
          if (zaloCta) zaloCta.style.display = "none";
        }, { once:true });

      } else {
        // ===== KHÔNG PHẢI ZALO: giữ luồng cũ — Trang 1 -> hết -> Trang 2 =====
        goToPageMobile(1, true);
        const v1 = mobVideos[0];
        const v2 = mobVideos[1];
        let advanced = false;

        function gotoSecond(){
          if (advanced) return;
          advanced = true;
          if (zaloCta) zaloCta.style.display = 'none';
          goToPageMobile(2, true);
          if (v2){ v2.preload = 'auto'; safePlay(v2); }
        }

        if (v1){
          v1.preload = 'auto';
          v1.muted = true;
          playWithGesture(v1);
          v1.addEventListener('playing', () => { if (zaloCta) zaloCta.style.display = 'none'; }, { once:true });

          const onEnded = () => {
            v1.removeEventListener('ended', onEnded);
            v1.removeEventListener('timeupdate', onTimeUpdate);
            gotoSecond();
          };
          const onTimeUpdate = () => {
            if (v1.duration && (v1.duration - v1.currentTime) <= 0.25) {
              v1.removeEventListener('timeupdate', onTimeUpdate);
              v1.removeEventListener('ended', onEnded);
              gotoSecond();
            }
          };
          v1.addEventListener('ended', onEnded, { once:true });
          v1.addEventListener('timeupdate', onTimeUpdate);
        } else {
          gotoSecond();
        }
      }
    }

    if (zaloCta) {
      zaloCta.addEventListener('click', playInviteNow);
      zaloCta.addEventListener('touchend', e => { e.preventDefault(); playInviteNow(); }, { passive:false });
    }

    // ===== Mặc định hiển thị trang 1 =====
    goToPageDesktop(1, false);
    goToPageMobile(1, false);
  </script>

</body>
</html>
