<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>15 năm Phucbinh Group</title>
  <link rel="icon" href="https://phucbinh.com.vn/wp-content/uploads/2023/03/cropped-Group-8-180x180.png" type="image/png" sizes="500x500">
  <link rel="canonical" href="https://www.15namphucbinhgroup.online/">
  <meta property="og:locale" content="vi_VN">
  <meta property="og:title" content="15 năm Phucbinh Group">
  <meta property="og:description" content="Cùng nhau kiến tạo tương lai">
  <meta property="og:url" content="https://www.15namphucbinhgroup.online/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Phucbinh Group">
  <meta property="og:image" content="https://i.pinimg.com/736x/7b/ba/16/7bba16221be6308721a09eefffc13ab3.jpg">
  <meta property="og:image:secure_url" content="https://i.pinimg.com/736x/7b/ba/16/7bba16221be6308721a09eefffc13ab3.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <link rel="stylesheet" rel="stylesheet" data-src="./css/common.css"  data-obf="" />
  <link rel="stylesheet" rel="stylesheet" data-src="./css/desktop.css" data-obf="" />
  <link rel="stylesheet" rel="stylesheet" data-src="./css/mobile.css"  data-obf="" />
  <style>
  .mob-video::-webkit-media-controls,
  .mob-video::-webkit-media-controls-enclosure { display: none !important; }

  #overlayReload { display:none; }
  #overlayReload.show { display:flex; }
  #zaloCta{
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%,-50%);
    z-index: 10001;
    display: none;
    background: #b3b3b3; color: #000;
    max-width: 90vw;
    padding: 14px 16px;
    font-size: 18px; font-weight: 700; line-height: 1.35;
    text-align: center;
    white-space: normal; overflow-wrap: anywhere; word-break: break-word;

    border: 0; border-radius: 999px;
    box-shadow: 0 10px 28px rgba(0,0,0,.25);
    cursor: pointer; -webkit-tap-highlight-color: transparent;
  }
  #zaloCta:active{ transform: translate(-50%,-50%) scale(.98); }

  /* ===== Backdrop sau CTA (hiện trong Zalo bằng JS) ===== */
  #zaloBackdrop{
    position: fixed; inset: 0; z-index: 10000; display: none;
    background: url("./img/zalo-bg.png") center center / cover no-repeat;
  }

  /* ===== Hiệu ứng PULSE mặc định (tự chạy) cho Zalo ===== */
  @keyframes pulseBtn {
    0%,100% { transform: translate(-50%,-50%) scale(1); }
    50%     { transform: translate(-50%,-50%) scale(1.05); }
  }

  /* ===== Chỉ Zalo: dùng ảnh nút + auto pulse và KHÔNG phủ mờ ===== */
  body.is-zalo #zaloCta{
    background: url("./img/nutbam.png") center center / contain no-repeat !important;
    background-color: transparent !important;
    color: transparent !important;
    box-shadow: none !important;
    filter: none !important;
    opacity: 1 !important;
    mix-blend-mode: normal !important;
    appearance: none !important;
    outline: none !important;
    -webkit-tap-highlight-color: transparent !important;

    padding: 0 !important;
    border: none !important;
    border-radius: 0 !important;

    width: 1920px !important;
    height: 1080px !important;
  
    animation: pulseBtn 1.2s ease-in-out infinite;
  }

  /* ===== Nút BAY sang phải khi bấm (áp cho chính nút) ===== */
  @keyframes ctaFlyRight {
    0%   { transform: translate(-50%,-50%) scale(1); opacity: 1; }
    100% { transform: translate(150vw,-50%) rotate(6deg) scale(1); opacity: 0; }
  }
  body.is-zalo #zaloCta.flying { animation: ctaFlyRight .9s ease-in forwards; }

  /* ==== TÁCH CHẾ ĐỘ ZALO ==== */
  .zalo-only{ display: none !important; }
  .non-zalo{  display: block !important; }
  body.is-zalo .zalo-only{ display: block !important; }
  body.is-zalo .non-zalo{  display: none !important; }

  /* Ẩn nút điều hướng khi là Zalo */
  body.is-zalo .mobile-layout .button,
  body.is-zalo .desktop-layout .prev-button,
  body.is-zalo .desktop-layout .next-button{ display: none !important; }

  /* ==== Hiệu ứng chuyển trang CHỈ trong Zalo ==== */
  body.is-zalo #sliderMobile {
    transition: transform 0.8s ease-in-out; 
  }
  body.is-zalo #sliderMobile .slide {
    opacity: .35;
    transform: scale(.985);
    transition: opacity 600ms ease, transform 600ms ease;
    will-change: opacity, transform;
  }
  body.is-zalo #sliderMobile .slide.active {
    opacity: 1;
    transform: scale(1);
  }
  </style>
</head>

<body>
  <div id="overlayReload">
    <div class="logo-loader">
      <img src="https://phucbinh.com.vn/wp-content/uploads/2023/03/cropped-Group-8-180x180.png" alt="Phucbinh Group">
    </div>
  </div>

  <div id="zaloBackdrop" aria-hidden="true"></div>

  <!-- ===== DESKTOP ===== -->
  <div class="desktop-layout">
    <div class="slider-container">
      <div class="slider-wrapper" id="sliderDesktop">
        <div class="slide">
          <video class="desk-video" preload="metadata" muted playsinline data-protect="blob">
            <!-- ./data/1pc.mp4 -->
            <source data-obf="AUEPXhpFAE0RDVRVTV4=" type="video/mp4"/>
          </video>
        </div>
        <div class="slide">
          <video class="desk-video" preload="metadata" muted playsinline data-protect="blob">
            <!-- ./data/2pc.mp4 -->
            <source data-obf="AUEPXhpFA00RDVRVTV4=" type="video/mp4"/>
          </video>
        </div>
      </div>
      <button class="prev-button" onclick="goToPageDesktop(1, true)">&#10094;</button>
      <button class="next-button" onclick="goToPageDesktop(2, true)">&#10095;</button>
    </div>
  </div>

  <!-- ===== MOBILE ===== -->
  <div class="mobile-layout">
    <div class="slider-container">
      <div class="slider-wrapper" id="sliderMobile">
        <div class="slide">
          <video class="mob-video non-zalo" preload="auto" autoplay
                 muted playsinline webkit-playsinline x5-playsinline x5-video-player-type="h5"
                 disablepictureinpicture controlslist="nodownload noplaybackrate nofullscreen noremoteplayback"
                 data-protect="blob">
            <source data-obf="BRIdV1BdCxIWWABNEQ1UVU1e" type="video/mp4"/>
          </video>
          <video class="mob-video zalo-only" preload="auto"
                 muted playsinline webkit-playsinline x5-playsinline x5-video-player-type="h5"
                 disablepictureinpicture controlslist="nodownload noplaybackrate nofullscreen noremoteplayback">
            <source data-src="./data/zalo.mp4" type="video/mp4"/>
          </video>
        </div>

        <div class="slide">
          <video class="mob-video" preload="none" poster=""
                 muted playsinline webkit-playsinline x5-playsinline x5-video-player-type="h5"
                 disablepictureinpicture controlslist="nodownload noplaybackrate nofullscreen noremoteplayback"
                 data-protect="blob">
            <source data-obf="BRIdV1BdCxIWWANNEQ1UVU1e" type="video/mp4"/>
          </video>
        </div>
      </div>

      <button class="button prev-button" onclick="goToPageMobile(1, true)">&#10094;</button>
      <button class="button next-button" onclick="goToPageMobile(2, true)">&#10095;</button>
    </div>
  </div>

  <!-- CTA -->
  <button id="zaloCta" type="button" aria-label="Xem thiệp mời">
    Chạm để đến với chuyến bay 15 năm<br>Phucbinh Group
  </button>

  <!-- ====== SCRIPT MÃ HOÁ/GIẢI MÃ + VIDEO BLOB ====== -->
  <script>
  (function () {
    const KEY = 'pb15y'; // đổi tuỳ ý mỗi lần build

    function xorStr(input, key) {
      let out = '';
      for (let i = 0; i < input.length; i++) {
        out += String.fromCharCode(input.charCodeAt(i) ^ key.charCodeAt(i % key.length));
      }
      return out;
    }
    function b64e(s){ return btoa(unescape(encodeURIComponent(s))); }
    function b64d(s){ return decodeURIComponent(escape(atob(s))); }

    // Console helper nếu muốn tự gen thêm obf
    window._obfGen = function (url) {
      const x = xorStr(url, KEY);
      const rev = x.split('').reverse().join('');
      return b64e(rev);
    };

    window._obfGetUrl = function (obf) {
      try{
        const rev = b64d(obf);
        const x = rev.split('').reverse().join('');
        const url = xorStr(x, KEY);
        return new URL(url, location.href).toString();
      }catch(e){
        return '';
      }
    };

    // Fetch → Blob URL để không lộ URL gốc trong DOM (video)
    async function setVideoSrcViaBlob(videoEl, obf) {
      try{
        const url = window._obfGetUrl(obf);
        const res = await fetch(url, { mode: 'cors', credentials: 'omit' });
        if (!res.ok) throw new Error('fetch failed');
        const blob = await res.blob();
        const blobUrl = URL.createObjectURL(blob);
        videoEl.querySelectorAll('source').forEach(s => s.remove());
        videoEl.removeAttribute('src');
        videoEl.src = blobUrl;
        videoEl.dataset.blobUrl = blobUrl;
        return true;
      }catch(e){
        return false;
      }
    }

    // Gán src video: ưu tiên Blob nếu video có data-protect="blob"
    window.applyObfuscatedVideoSources = async function (root=document) {
      const tasks = [];
      root.querySelectorAll('video').forEach(v => {
        const srcEl = v.querySelector('source[data-obf]');
        if (!srcEl) return;
        const obf = srcEl.getAttribute('data-obf');
        const wantsBlob = v.getAttribute('data-protect') === 'blob';

        if (wantsBlob) {
          tasks.push((async () => {
            const ok = await setVideoSrcViaBlob(v, obf);
            if (!ok) {
              const url = window._obfGetUrl(obf);
              if (url) { srcEl.setAttribute('src', url); v.load(); }
            }
          })());
        } else {
          const url = window._obfGetUrl(obf);
          if (url) srcEl.setAttribute('src', url);
        }
      });
      await Promise.allSettled(tasks);
    };

    // Zalo: gán URL rõ (data-src) cho các nguồn giữ nguyên
    window.applyPlainSourcesForZalo = function (root=document) {
      // video zalo-only
      root.querySelectorAll('video.zalo-only source[data-src]').forEach(s => {
        const url = s.getAttribute('data-src');
        if (url) s.setAttribute('src', url);
      });
      // CSS dùng data-src
      root.querySelectorAll('link[rel="stylesheet"][data-src]').forEach(l => {
        const url = l.getAttribute('data-src');
        if (url) l.setAttribute('href', url);
      });
    };

    // ===== CSS LOADER (Blob/obf ngoài Zalo; plain khi Zalo) =====
    async function setStylesheetViaBlob(linkEl, url) {
      try {
        const res = await fetch(url, { mode: 'cors', credentials: 'omit' });
        if (!res.ok) throw new Error('fetch css failed');
        const css = await res.text();
        const blob = new Blob([css], { type: 'text/css' });
        const blobUrl = URL.createObjectURL(blob);
        linkEl.setAttribute('href', blobUrl);
        linkEl.dataset.blobUrl = blobUrl;
        return true;
      } catch (e) { return false; }
    }

    window.applyStylesheetsSmart = async function (isZalo, root=document) {
      if (isZalo) {
        // Zalo: href = data-src (URL rõ)
        window.applyPlainSourcesForZalo(root);
        return;
      }
      // Ngoài Zalo:
      const tasks = [];
      root.querySelectorAll('link[rel="stylesheet"][data-src]').forEach(l => {
        const obf = l.getAttribute('data-obf') || '';
        const url = obf ? window._obfGetUrl(obf) : new URL(l.getAttribute('data-src'), location.href).toString();
        if (!url) return;
        tasks.push(setStylesheetViaBlob(l, url).then(ok => {
          if (!ok) l.setAttribute('href', url); // fallback: lộ URL nếu fetch bị CORS chặn
        }));
      });
      await Promise.allSettled(tasks);
    };
  })();
  </script>

  <!-- ====== SCRIPT CHÍNH ====== -->
  <script>
    const sliderDesktop = document.getElementById("sliderDesktop");
    const sliderMobile  = document.getElementById("sliderMobile");
    const overlay       = document.getElementById("overlayReload");

    const deskVideos = Array.from(document.querySelectorAll(".desk-video"));

    const isMobile = /mobile|android|iphone|ipad|ipod/i.test(navigator.userAgent);
    const isZalo   = /zalo/i.test(navigator.userAgent);

    const zaloCta  = document.getElementById('zaloCta');
    const zaloBackdrop = document.getElementById('zaloBackdrop');

    if (isZalo) document.body.classList.add('is-zalo');
    if (isMobile && isZalo && zaloCta){
      zaloCta.style.display = 'inline-flex';
      if (zaloBackdrop) zaloBackdrop.style.display = 'block';
    }

    // Áp dụng CSS theo chế độ
    if (typeof applyStylesheetsSmart === 'function') {
      applyStylesheetsSmart(isZalo, document);
    }

    function resetAll(videos){ videos.forEach(v => { try{ v.pause(); v.currentTime = 0; }catch(e){} }); }
    resetAll(deskVideos);

    function goToPageDesktop(page, restart=false){
      const offset = (page - 1) * 50;
      if (sliderDesktop) sliderDesktop.style.transform = `translateX(-${offset}%)`;
      resetAll(deskVideos);
      const idx = page - 1;
      const target = deskVideos[idx];
      if (target){ if (restart) target.currentTime = 0; safePlay(target); }
    }

    function playWithGesture(videoEl){
      try{
        videoEl.muted = true;
        videoEl.setAttribute('playsinline','');
        videoEl.setAttribute('webkit-playsinline','');
        const p = videoEl.play();
        if (p && typeof p.then === 'function'){
          p.then(()=>{}).catch(()=>{
            videoEl.load();
            const onReady = () => { videoEl.removeEventListener('canplay', onReady); videoEl.play().catch(()=>{}); };
            videoEl.addEventListener('canplay', onReady, { once:true });
          });
        }
      }catch(e){
        try{
          videoEl.load();
          videoEl.addEventListener('canplay', () => videoEl.play().catch(()=>{}), { once:true });
        }catch(_){}
      }
    }

    function safePlay(videoEl){
      videoEl.load();
      const go = () => videoEl.play().catch(()=>{});
      if (videoEl.readyState >= 2) go();
      else videoEl.addEventListener('canplay', go, { once:true });
    }

    function getMobVideos(){
      return Array.from(document.querySelectorAll('.mobile-layout .mob-video'))
                  .filter(v => v.offsetParent !== null);
    }

    /* ===== Hiệu ứng chuyển trang: đánh dấu slide active (chỉ áp dụng trong Zalo) ===== */
    const slidesMobile = Array.from(document.querySelectorAll('#sliderMobile .slide'));
    function setActiveMobile(page){
      if (!isZalo) return;
      slidesMobile.forEach((s, i) => {
        if (i === (page - 1)) s.classList.add('active');
        else s.classList.remove('active');
      });
    }

    // ==== Mobile: phát ngay trong gesture click/touch (hợp Zalo) ====
    function goToPageMobile(page, restart=false){
      const videos = getMobVideos();
      const offset = (page - 1) * 50;
      if (sliderMobile) sliderMobile.style.transform = `translateX(-${offset}%)`;

      // hiệu ứng chuyển trang (chỉ Zalo)
      setActiveMobile(page);

      // reset chỉ những video hiển thị
      videos.forEach(v => { try{ v.pause(); v.currentTime = 0; }catch(e){} });

      const idx = page - 1;
      const target = videos[idx];
      if (!target) return;

      target.preload = 'auto';
      if (restart) target.currentTime = 0;

      safePlay(target);
    }

    document.querySelectorAll('.mobile-layout .button').forEach(btn=>{
      btn.addEventListener('touchend', e => { e.currentTarget.click(); }, { passive:true });
    });

    function softReload(){
      overlay.classList.add('show');
      resetAll(deskVideos);
      const mobVideosNow = getMobVideos();
      mobVideosNow.forEach(v => { try{ v.pause(); v.currentTime = 0; }catch(e){} });

      [...deskVideos, ...mobVideosNow].forEach(v => {
        const srcEl = v.querySelector('source'); 
        if (!srcEl) return;
        try{
          const url = new URL(srcEl.getAttribute('src'), location.href);
          url.searchParams.set('_r', Date.now().toString());
          srcEl.setAttribute('src', url.toString()); v.load();
        }catch(e){ v.load(); }
      });

      let done = false;
      const off = () => { if (!done){ done = true; overlay.classList.remove('show'); } };
      setTimeout(off, 3000);
      const anyVideo = deskVideos[0] || getMobVideos()[0];
      if (anyVideo) anyVideo.addEventListener('loadeddata', off, { once:true });
    }

    // Bấm CTA: (Zalo giữ nguyên), ngoài Zalo: giải mã + Blob sau tương tác
    async function playInviteNow(){
      if (isZalo && zaloCta){
        zaloCta.classList.add('flying');
        zaloCta.addEventListener('animationend', () => {
          if (zaloCta) zaloCta.style.display = 'none';
          if (zaloBackdrop) zaloBackdrop.style.display = 'none';
        }, { once:true });
      }

      if (!isZalo && typeof applyObfuscatedVideoSources === 'function') {
        await applyObfuscatedVideoSources(document);
      } else if (isZalo && typeof applyPlainSourcesForZalo === 'function') {
        applyPlainSourcesForZalo(document);
      }

      // phát video trang 1
      goToPageMobile(1, true);
      const vids = getMobVideos();
      const v1 = vids[0];
      if (v1){
        v1.preload = 'auto';
        v1.muted = true;
        playWithGesture(v1);
        v1.addEventListener('playing', () => {
          if (zaloCta) zaloCta.style.display = 'none';
          if (zaloBackdrop) zaloBackdrop.style.display = 'none';
        }, { once:true });
      } else {
        if (zaloCta) zaloCta.style.display = 'none';
        if (zaloBackdrop) zaloBackdrop.style.display = 'none';
      }

      if (!isZalo) {
        setTimeout(() => {
          const nextBtn = document.querySelector('.mobile-layout .next-button');
          if (nextBtn) nextBtn.click();
          else {
            goToPageMobile(2, true);
            const _vids = getMobVideos();
            const v2 = _vids[1];
            if (v2){ v2.preload = 'auto'; safePlay(v2); }
          }
        }, 5000);
      }
    }

    if (zaloCta){
      zaloCta.addEventListener('click', playInviteNow);
      zaloCta.addEventListener('touchend', e => { e.preventDefault(); playInviteNow(); }, { passive:false });
    }
    if (zaloBackdrop){
      zaloBackdrop.addEventListener('click', () => zaloCta && zaloCta.click());
      zaloBackdrop.addEventListener('touchend', (e) => { e.preventDefault(); zaloCta && zaloCta.click(); }, { passive:false });
    }

    // Khởi tạo nguồn video/CSS theo chế độ:
    if (!isZalo && typeof applyObfuscatedVideoSources === 'function') {
      // có thể giải mã ngay để preload
      applyObfuscatedVideoSources(document);
    } else if (isZalo && typeof applyPlainSourcesForZalo === 'function') {
      applyPlainSourcesForZalo(document);
    }

    // ===== MẶC ĐỊNH =====
    goToPageDesktop(1, false);
    setActiveMobile(1);

    if (isMobile && !isZalo){
      const vids = getMobVideos();
      const v1 = vids[0];
      if (v1){
        v1.muted = true; v1.setAttribute('muted','');
        v1.setAttribute('playsinline',''); v1.setAttribute('webkit-playsinline','');
        v1.preload = 'auto';
        if (sliderMobile) sliderMobile.style.transform = 'translateX(0%)';
        const tryPlay = () => v1.play().catch(()=>{});
        if (v1.readyState >= 2) tryPlay();
        else { v1.load(); v1.addEventListener('canplay', tryPlay, { once: true }); }
        document.addEventListener('visibilitychange', () => { if (!document.hidden) v1.play().catch(()=>{}); }, { once:true });
        const firstTouchPlay = () => { v1.play().catch(()=>{}); window.removeEventListener('touchend', firstTouchPlay); };
        window.addEventListener('touchend', firstTouchPlay, { passive: true });
      }else{
        goToPageMobile(1, false);
      }
    }else{
      goToPageMobile(1, false);
    }
  </script>
</body>
</html>
