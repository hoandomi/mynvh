<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>15 năm Phucbinh Group</title>
  <link rel="icon" href="https://phucbinh.com.vn/wp-content/uploads/2023/03/cropped-Group-8-180x180.png" type="image/png" sizes="500x500">

  <!-- ========== SOCIAL PREVIEW (Open Graph + Twitter Card) ========== -->
  <link rel="canonical" href="https://www.15namphucbinhgroup.online/">
  <meta property="og:locale" content="vi_VN">
  <meta property="og:title" content="15 năm Phucbinh Group">
  <meta property="og:description" content="Cùng nhau kiến tạo tương lai">
  <meta property="og:url" content="https://www.15namphucbinhgroup.online/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Phucbinh Group">
  <meta property="og:image" content="https://i.pinimg.com/736x/7b/ba/16/7bba16221be6308721a09eefffc13ab3.jpg">
  <meta property="og:image:secure_url" content="https://i.pinimg.com/736x/7b/ba/16/7bba16221be6308721a09eefffc13ab3.jpg">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">

  <!-- Thứ tự QUAN TRỌNG: common trước, rồi desktop, rồi mobile -->
  <link rel="stylesheet" href="./css/common.css">
  <link rel="stylesheet" href="./css/desktop.css">
  <link rel="stylesheet" href="./css/mobile.css">

  <!-- Ẩn mọi control WebKit cho mobile video đề phòng hệ thống tự hiện -->
  <style>
    .mob-video::-webkit-media-controls,
    .mob-video::-webkit-media-controls-enclosure { display: none !important; }
  </style>
</head>

<body>

  <!-- Overlay với logo quay (không crop, responsive) -->
  <div id="overlayReload">
    <div class="logo-loader">
      <img src="https://phucbinh.com.vn/wp-content/uploads/2023/03/cropped-Group-8-180x180.png" alt="Phucbinh Group">
    </div>
  </div>

  <!-- ===== DESKTOP ===== -->
  <div class="desktop-layout">
    <div class="slider-container">
      <div class="slider-wrapper" id="sliderDesktop">
        <!-- Trang 1 -->
        <div class="slide">
          <video class="desk-video" preload="metadata" muted playsinline>
            <source src="./data/1pc.mp4" type="video/mp4"/>
          </video>
        </div>
        <!-- Trang 2 -->
        <div class="slide">
          <video class="desk-video" preload="metadata" muted playsinline>
            <source src="./data/2pc.mp4" type="video/mp4"/>
          </video>
        </div>
      </div>

      <!-- Nút điều hướng -->
      <button class="prev-button" onclick="goToPageDesktop(1, true)">&#10094;</button>
      <button class="next-button" onclick="goToPageDesktop(2, true)">&#10095;</button>
    </div>
  </div>

  <!-- ===== MOBILE ===== -->
  <div class="mobile-layout">
    <div class="slider-container">
      <div class="slider-wrapper" id="sliderMobile">
        <!-- Trang 1 -->
        <div class="slide">
          <!-- Mobile: mở web đen, không tự chạy; chỉ chạy khi bấm -->
          <video class="mob-video"
                 preload="auto"
                 autoplay
                 muted playsinline webkit-playsinline
                 x5-playsinline x5-video-player-type="h5"
                 disablepictureinpicture
                 controlslist="nodownload noplaybackrate nofullscreen noremoteplayback">
            <source src="./data/1mobile.mp4" type="video/mp4"/>
          </video>
        </div>
        <!-- Trang 2 -->
        <div class="slide">
          <video class="mob-video"
                 preload="none"
                 poster=""
                 muted playsinline webkit-playsinline
                 x5-playsinline x5-video-player-type="h5"
                 disablepictureinpicture
                 controlslist="nodownload noplaybackrate nofullscreen noremoteplayback">
            <source src="./data/2mobile.mp4" type="video/mp4"/>
          </video>
        </div>
      </div>

      <!-- Nút điều hướng -->
      <button class="button prev-button" onclick="goToPageMobile(1, true)">&#10094;</button>
      <button class="button next-button" onclick="goToPageMobile(2, true)">&#10095;</button>
    </div>
  </div>
 <script>
  // ===== DOM =====
  const sliderDesktop = document.getElementById("sliderDesktop");
  const sliderMobile  = document.getElementById("sliderMobile");
  const overlay       = document.getElementById("overlayReload");

  const deskVideos = Array.from(document.querySelectorAll(".desk-video"));
  const mobVideos  = Array.from(document.querySelectorAll(".mob-video"));

  // ===== Helper =====
  function resetAll(videos) { videos.forEach(v => { try{ v.pause(); v.currentTime = 0; }catch(_){} }); }

  function ensureAttrs(v){
    if (!v) return;
    v.muted = true; v.autoplay = true; v.preload = 'auto';
    v.setAttribute('muted',''); v.setAttribute('autoplay',''); v.setAttribute('preload','auto');
    v.setAttribute('playsinline',''); v.setAttribute('webkit-playsinline','');
    if (v.hasAttribute('poster')) v.removeAttribute('poster');
  }

  function safePlay(v){
    if (!v) return;
    try{
      v.load();
      const go = () => v.play().catch(()=>{});
      (v.readyState >= 2) ? go() : v.addEventListener('canplay', go, {once:true});
    }catch(_){}
  }

  // Gắn log lỗi để bắt 404/MIME
  function attachDebug(v, label){
    if (!v || v._debugged) return;
    v._debugged = true;
    v.addEventListener('error', () => {
      const s = v.querySelector('source');
      console.warn(`[VIDEO ERROR][${label}]`, s ? s.src : '(no source)', v.error);
      // Thử reload 1 lần sau 300ms
      setTimeout(()=>{ try{ v.load(); v.play().catch(()=>{}); }catch(_){ } }, 300);
    });
  }

  // ===== Desktop =====
  function goToPageDesktop(page, restart=false) {
    const offset = (page - 1) * 50;
    if (sliderDesktop) sliderDesktop.style.transform = `translateX(-${offset}%)`;
    resetAll(deskVideos);

    const v = deskVideos[page-1];
    if (!v) return;
    ensureAttrs(v);
    if (restart) try{ v.currentTime = 0; }catch(_){}
    safePlay(v);
    attachDebug(v, `desktop-${page}`);
  }

  // ===== Mobile =====
  function goToPageMobile(page, restart=false) {
    const offset = (page - 1) * 50;
    if (sliderMobile) sliderMobile.style.transform = `translateX(-${offset}%)`;
    resetAll(mobVideos);

    const v = mobVideos[page-1];
    if (!v) return;
    ensureAttrs(v);
    if (restart) try{ v.currentTime = 0; }catch(_){}
    safePlay(v);
    attachDebug(v, `mobile-${page}`);
  }

  // Bridge touchend -> click (webview)
  document.querySelectorAll('.mobile-layout .button, .mobile-layout .next-button, .mobile-layout .prev-button')
    .forEach(btn => btn.addEventListener('touchend', e => { e.currentTarget.click(); }, { passive:true }));

  // ===== Boot bằng GESTURE MỘT LẦN (fix WebView chặn autoplay) =====
  let bootstrapped = false;
  function bootstrapAutoplayOnce(){
    if (bootstrapped) return;
    bootstrapped = true;
    // Ẩn overlay nếu đang che
    if (overlay) overlay.classList.remove('show');

    // Ép lại & play video đang hiển thị ở cả 2 layout
    const curM = currentMobileIndex, curD = currentDesktopIndex;
    ensureAttrs(mobVideos[curM]);  safePlay(mobVideos[curM]);
    ensureAttrs(deskVideos[curD]); safePlay(deskVideos[curD]);
  }
  // Lắng nghe lần chạm/scroll/phím… đầu tiên
  ['touchstart','click','keydown','wheel'].forEach(evt=>{
    window.addEventListener(evt, bootstrapAutoplayOnce, { once:true, passive:true });
  });

  // ===== Pause/Resume khi ẩn tab =====
  document.addEventListener('visibilitychange', () => {
    if (document.hidden) {
      [...deskVideos, ...mobVideos].forEach(v => { try{ v.pause(); }catch(_){ } });
    } else {
      const vM = mobVideos[currentMobileIndex], vD = deskVideos[currentDesktopIndex];
      ensureAttrs(vM); ensureAttrs(vD); safePlay(vM); safePlay(vD);
    }
  });

  // ===== Track index =====
  let currentMobileIndex = 0;
  let currentDesktopIndex = 0;

  const _goToPageMobile = goToPageMobile;
  const _goToPageDesktop = goToPageDesktop;

  goToPageMobile = function(page, restart=false){
    currentMobileIndex = Math.max(0, Math.min(page - 1, mobVideos.length - 1));
    _goToPageMobile(page, restart);
  }
  goToPageDesktop = function(page, restart=false){
    currentDesktopIndex = Math.max(0, Math.min(page - 1, deskVideos.length - 1));
    _goToPageDesktop(page, restart);
  }

  // ===== Init =====
  (function init(){
    // Đảm bảo overlay không che
    if (overlay) overlay.classList.remove('show');

    // Ép attrs trước
    deskVideos.forEach(v => { ensureAttrs(v); attachDebug(v, 'desktop-init'); });
    mobVideos .forEach(v => { ensureAttrs(v); attachDebug(v, 'mobile-init');  });

    // Mở trang 1, cố play ngay
    goToPageDesktop(1, true);
    goToPageMobile(1, true);
  })();

  // ===== Soft reload (tuỳ chọn) =====
  function softReload() {
    if (!overlay) return;
    overlay.classList.add('show');
    resetAll(deskVideos); resetAll(mobVideos);

    [...deskVideos, ...mobVideos].forEach(v => {
      const s = v.querySelector('source');
      if (!s) return;
      try {
        const u = new URL(s.getAttribute('src'), location.href);
        u.searchParams.set('_r', Date.now().toString());
        s.setAttribute('src', u.toString());
        v.load();
      } catch (e) { v.load(); }
    });

    let done=false;
    const off=()=>{ if(!done){ done=true; overlay.classList.remove('show'); } };
    setTimeout(off, 3000);
    const any = deskVideos[0] || mobVideos[0];
    if (any) any.addEventListener('loadeddata', off, { once:true });
  }
</script>

</body>
</html>
